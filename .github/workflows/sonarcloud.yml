# SonarCloud code quality and security analysis.
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    # Dependabot PRs run without secrets (GitHub's standing policy withholds
    # them from dependabot-triggered workflows): SONAR_TOKEN arrives EMPTY,
    # the scanner authenticates anonymously, SonarCloud rejects the analysis
    # of the org project, and the job fails — every dependabot PR went red
    # this way (Nov 10 + Nov 21, wmp-js#47) while main's push runs (which DO
    # carry the token) stayed green. A dependency-bump PR needs no quality
    # gate: main's scan after the merge covers the new code.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clone WMP spec (test vectors and schemas)
        run: git clone --depth 1 https://github.com/sirosfoundation/wmp.git ../wmp

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
